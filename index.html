<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>De Koffieboot</title>
<meta name="description" content="De Koffieboot: een Amsterdamse pont als buurtkoffiezaak aan het Zijkanaal in Amsterdam-Noord.">
<meta name="theme-color" content="#1E4FA8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shrikhand&family=Inter:wght@600;700&display=swap">
<style>
/* Website: de scène vult het hele scherm; titel in posterletter eroverheen, camerastanden als knoppen onderin */
:root{--blauw:#1E4FA8;--creme:#f4efe4;--inkt:#16213a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#cfe3df;color:var(--inkt);overflow:hidden}
#wrap{position:fixed;inset:0;height:100dvh;background:#cfe3df;touch-action:none;overflow:hidden}
#c{display:block;width:100%;height:100%}
h1{position:absolute;z-index:2;left:max(18px,env(safe-area-inset-left));top:max(14px,env(safe-area-inset-top));margin:0;pointer-events:none;
 font:400 clamp(40px,8.5vw,104px)/.95 'Shrikhand',Georgia,serif;letter-spacing:.005em;color:var(--creme);
 text-shadow:3px 3px 0 var(--blauw),6px 6px 0 rgba(22,33,58,.25);-webkit-text-stroke:1px rgba(30,79,168,.35)}
/* knoppen uit de werkversie: Opbouw, Schoon beeld en hulptekst blijven verborgen */
#hint,#opb,#opbLabel,#err{display:none!important}
#views{position:absolute;z-index:2;left:0;right:0;bottom:max(12px,env(safe-area-inset-bottom));display:flex;gap:8px;padding:0 max(14px,env(safe-area-inset-left));
 overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;justify-content:safe center}
#views::-webkit-scrollbar{display:none}
#views button{flex:0 0 auto;font:700 13px/1 Inter,system-ui,sans-serif;padding:10px 15px;border:2px solid var(--blauw);border-radius:999px;background:var(--creme);color:var(--blauw);cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.15)}
#views button:hover{background:#fff}
#views button.on{background:var(--blauw);color:var(--creme)}
#views button:focus-visible{outline:3px solid var(--creme);outline-offset:2px}
#views button.verborgen{display:none}
#laden{position:absolute;inset:0;z-index:3;display:grid;place-items:center;font:700 16px Inter,system-ui,sans-serif;color:var(--blauw);background:#cfe3df;transition:opacity .6s}
#laden.weg{opacity:0;pointer-events:none}
#fout{position:absolute;inset:0;display:none;place-items:center;padding:24px;text-align:center;font:15px system-ui,sans-serif}
</style>
</head>
<body>
<div id="wrap">
 <h1>De Koffieboot</h1>
 <canvas id="c" aria-label="3D-scène van De Koffieboot aan het Zijkanaal"></canvas>
 <div id="hint"></div>
 <div id="laden">De boot komt eraan…</div>
 <div id="fout">De 3D-weergave kan in deze browser niet laden.</div>
<div id="views" role="toolbar" aria-label="Camerastanden"></div>
</div>
<div id="err"></div>
<script src="lib/three.min.js"></script>
<script src="js/three-extra.js"></script>
<script src="mensen/mensen-data.js"></script>
<script src="js/scene.js"></script>
<script>
// laadscherm weg zodra de scène er is; werkknoppen (Opbouw, Schoon beeld) verbergen; Avond-knop achteraan
(function(){const v=document.getElementById('views');
 v.querySelectorAll('button').forEach(b=>{if(b.textContent==='Opbouw'||b.textContent==='Schoon beeld')b.classList.add('verborgen');if(b.textContent==='Avond')v.appendChild(b)});
 if(window.koffieboot)document.getElementById('laden').classList.add('weg');else{document.getElementById('laden').style.display='none';document.getElementById('fout').style.display='grid'}})();
</script>
</body>
</html>
